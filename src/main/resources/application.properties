spring.application.name=baozi-store

# ===== Banco H2 (em memoria) - ativo por padrao, nao precisa instalar nada =====
spring.datasource.url=jdbc:h2:mem:baozidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Banco MySQL (alternativa) - comente o bloco H2 acima e descomente este =====
